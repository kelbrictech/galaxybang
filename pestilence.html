<!-- Remote multiplayer enabled -->
<style>
  @property --hue {
    syntax: '<color>';
    inherits: true;
    initial-value: rgba(120, 130, 150, 0.08);

  :root {
    color-scheme: dark;

  html {
    height: 100%;
    overscroll-behavior: none;

  canvas {
    display: block;

    background: #20252d;

  .panel {
    background: #1b1f26;

    width: min(86vw, 380px);

    overflow-y: auto;
    box-sizing: border-box;
    text-align: center;
    display: flex;

  }
  .panel h1 { font-size: 28px; line-height: 1.15; margin: 0 0 6px; }
  .panel h2 { font-size: 22px; margin: 0; }
  .panel p { margin: 0; color: #98a0ad; }

  .label {
    font-size: 12px;

    color: #8a92a0;
    margin-top: 6px;

  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1;

    border: 2px solid #333a47;

  .seg button small { display: block; font-size: 12px; font-weight: 400; opacity: 0.7; margin-top: 2px; }
  .seg button.sel { border-color: #fff; background: #2d3441; color: #fff; }
  .color-swatch {
    display: flex;
    align-items: center;

  .remote-input { width: 100%; box-sizing: border-box; min-height: 48px; border-radius: 9px; border: 1px solid #3a4150; background: #11151b; color: #fff; text-align: center; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; }

  /* PESTILENCE classic wheat-field reskin */

  /* Landing screen: calm hierarchy, compact controls, progressive disclosure */

  .color-pick {

  .menu-panel .primary { min-height:48px; border-radius:11px; font-size:15px; letter-spacing:.2px; }
  .menu-panel .secondary { min-height:42px; border-radius:10px; font-size:13px; }

  .join-box[hidden], .menu-section[hidden] { display:none !important; }
  .join-box .remote-input { min-height:44px; font-size:17px; letter-spacing:5px; }

  @media (max-height: 700px) {
    .panel.menu-panel { gap:11px; padding:18px 22px; }

    .mode-grid { gap:5px; }

</style>

<body>
  <div id="players"></div>
  <div id="message"></div>
  <canvas id="board"></canvas>
  <div id="controls">
    <button id="reset" class="small-btn">New game</button>
    <button id="mute" class="small-btn" aria-label="Toggle sound">🔊</button>
  </div>
  <div id="overlay"><div class="panel" id="panel"></div></div>
<script>
const BOARDS = {
  small: { cols: 6, rows: 8 },
  standard: { cols: 9, rows: 12 }
};
const PADDING = 16;
const TAU = Math.PI * 2;
const TUNING = {
  atomScale: 1,
  orbitIdle: 1.2,
  orbitUnstable: 3.4,
  orbitCharging: 10,
  shake: 1,
  turnGuardMs: 350,
  hueAlpha: 0.2
};
const PLAYERS = [
  { name: 'Locusts', color: '#a7c94b', light: '#e0f5a2', dark: '#536b20', rgb: '167,201,75', shape: 'triangle', note: 262 },
  { name: 'Hornets', color: '#e4a43c', light: '#ffe0a0', dark: '#865018', rgb: '228,164,60', shape: 'diamond', note: 330 },
  { name: 'Rats', color: '#b77bba', light: '#e8c2e9', dark: '#68436c', rgb: '183,123,186', shape: 'square', note: 392 },
  { name: 'Snails', color: '#65b9c2', light: '#c1eef0', dark: '#286b72', rgb: '101,185,194', shape: 'circle', note: 494 }
];
const COLORS = { cellA: '#a98d45', cellB: '#967a38', line: '#6f5a2d', frame: '#d0b66b' };
const LAYOUT = {
  1: { orbit: 0.05, size: 0.26 },
  2: { orbit: 0.19, size: 0.17 },
  3: { orbit: 0.20, size: 0.16 },
  4: { orbit: 0.22, size: 0.14 }
};
const DENIED_MS = 450;
const CHARGE_MS = 130;
const FLY_MS = 320;
const POP_MS = 260;
const BANNER_MS = 1100;
const CHAIN_FADE_MS = 900;
const MAX_WAVES = 200;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const settings = { players: 4, board: 'standard', mode: 'local', humanColor: 0 };
const REMOTE_API = 'https://galaxybang-multiplayer.kelbrictech.workers.dev';
let remote = { code: null, token: null, color: null, isHost: false, poll: null, snapshot: null };
async function remoteRequest(path, method='GET', body=null) {
  const url = REMOTE_API + path + (path.includes('?') ? '&' : '?') + (remote.token ? 'token=' + encodeURIComponent(remote.token) : '');
  const response = await fetch(url, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || 'Remote play request failed.');
  return data;
}
function applyRemoteState(s) {
  if (!s || !s.owner) return;
  const changed = COLS !== s.cols || ROWS !== s.rows;
  COLS=s.cols; ROWS=s.rows; owner=s.owner; count=s.count; current=s.current;
  turnOrder=s.players.map(p=>p.color); eliminated=s.eliminated; winner=s.winner;
  hasPlayed=PLAYERS.map((_,i)=>turnOrder.includes(i)); moveCount=s.moveCount; busy=false;
  remote.snapshot=s; settings.players=s.targetInfestations; settings.board=s.board; settings.mode='remote';
  chips.forEach((el,i)=>{el.style.display=turnOrder.includes(i)?'':'none';});
  updateUI(); if(changed) resize(); else draw();
}
function stopRemotePolling(){ if(remote.poll) clearInterval(remote.poll); remote.poll=null; }
function startRemotePolling(){
  stopRemotePolling();
  remote.poll=setInterval(async()=>{try{const s=await remoteRequest('/room/'+remote.code+'/state');applyRemoteState(s);if(s.winner!==-1){if(!overlay.classList.contains('show'))setTimeout(openResult,500);}else if(panel.querySelector('#remoteMenu'))closeOverlay();}catch(e){messageEl.textContent=e.message;}},1000);
}
async function createRemoteRoom(){
  try {
    const response=await fetch(REMOTE_API+'/room/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({players:settings.players,board:settings.board})});
    const data=await response.json(); if(!response.ok)throw new Error(data.error||'Unable to create room.');
    remote.code=data.code;remote.token=data.token;remote.color=data.color;remote.isHost=true;applyRemoteState(data.state);openRemoteLobby();startRemotePolling();
  } catch(e){alert('Remote Play: '+e.message);}
}
async function joinRemoteRoom(code){
  try {
    const response=await fetch(REMOTE_API+'/room/'+encodeURIComponent(code)+'/join',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to join room.');
    remote.code=data.code;remote.token=data.token;remote.color=data.color;remote.isHost=false;applyRemoteState(data.state);openRemoteLobby();startRemotePolling();
  }catch(e){alert('Remote Play: '+e.message);}
}
function openRemoteLobby(){
  panel.classList.remove('menu-panel');
  panel.innerHTML='<h1>Remote Room</h1><p>Share this code with the other players.</p><div class="remote-code" id="roomCode"></div><p id="lobbyStatus">Waiting for players…</p><button class="primary" id="roomStart">Start game</button><button class="secondary" id="roomLeave">Leave room</button>';
  panel.querySelector('#roomCode').textContent=remote.code;
  const start=panel.querySelector('#roomStart');start.style.display=remote.isHost?'':'none';
  start.addEventListener('click',async()=>{try{const s=await remoteRequest('/room/'+remote.code+'/start','POST',{});applyRemoteState(s);closeOverlay();startRemotePolling();}catch(e){alert(e.message);}});
  panel.querySelector('#roomLeave').addEventListener('click',()=>{stopRemotePolling();remote={code:null,token:null,color:null,isHost:false,poll:null,snapshot:null};openMenu();});
  overlay.classList.add('show');
  const refreshLobby=async()=>{try{const s=await remoteRequest('/room/'+remote.code+'/state');applyRemoteState(s);panel.querySelector('#lobbyStatus').textContent=s.seats+' / '+s.targetPlayers+' players connected';if(s.started){closeOverlay();stopLobby();startRemotePolling();}}catch(e){panel.querySelector('#lobbyStatus').textContent=e.message;}};
  const lobbyTimer=setInterval(refreshLobby,1000);function stopLobby(){clearInterval(lobbyTimer);}
}
async function remoteMove(col,row){
  if(busy||winner!==-1||current!==remote.color)return;
  busy=true;updateUI('Sending move…');
  try{const s=await remoteRequest('/room/'+remote.code+'/move','POST',{col,row});applyRemoteState(s);if(s.winner!==-1){setTimeout(()=>{if(!overlay.classList.contains('show'))openResult();},500);}}
  catch(e){busy=false;updateUI(e.message);}
}

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const messageEl = document.getElementById('message');
const playersEl = document.getElementById('players');
const controlsEl = document.getElementById('controls');
const resetBtn = document.getElementById('reset');
const muteBtn = document.getElementById('mute');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

let COLS = 9, ROWS = 12;
let owner, count, spin;
let current, hasPlayed, eliminated, winner, busy, moveCount;
let denied, banner, chainFx = null, guardUntil = 0;
let flights = [], fx = [], particles = [], charging = null;
let pops = new Map();
let shake = { amp: 0, start: 0, dur: 1 }, shaking = false;
let gameId = 0;
let cell = 0;
let lastT = performance.now();
let turnOrder = [];
let aiTimer = null;

const chips = PLAYERS.map(p => {
  const el = document.createElement('div');
  el.className = 'chip';
  el.innerHTML = `<span class="dot" style="background:${p.color}"></span>
                  <span>${p.name}</span>
                  <span class="count">0</span>`;
  playersEl.appendChild(el);
  return el;
});

let audio = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (!audio) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
    master = audio.createGain();
    master.gain.value = 0.5;
    master.connect(audio.destination);
    noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = audio.createBufferSource();
    s.buffer = audio.createBuffer(1, 1, 22050);
    s.connect(audio.destination);
    s.start(0);
  }
  if (audio.state === 'suspended') audio.resume();
}
['pointerdown', 'touchend', 'click'].forEach(ev =>
  window.addEventListener(ev, initAudio, { capture: true, passive: true }));

function tone({ freq, to, dur = 0.12, type = 'sine', vol = 0.3, delay = 0 }) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t);
  o.stop(t + dur + 0.03);
}
function noise({ dur = 0.3, vol = 0.3, from = 1500, to = 150, delay = 0 }) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay;
  const src = audio.createBufferSource();
  src.buffer = noiseBuf;
  const f = audio.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(from, t);
  f.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = audio.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(master);
  src.start(t);
  src.stop(t + dur + 0.03);
}
const sfx = {
  click() { tone({ freq: 520, dur: 0.06, type: 'triangle', vol: 0.15 }); },
  place(p) { tone({ freq: PLAYERS[p].note, dur: 0.14, type: 'triangle', vol: 0.3 }); },
  add(n, p) { tone({ freq: PLAYERS[p].note * Math.pow(2, n * 3 / 12), dur: 0.14, type: 'triangle', vol: 0.3 }); },
  denied() { tone({ freq: 150, to: 85, dur: 0.2, type: 'sawtooth', vol: 0.18 }); },
  charge(wave, ms) {
    const f = 200 * Math.pow(2, Math.min(wave, 12) / 12);
    tone({ freq: f, to: f * 1.6, dur: ms / 1000, type: 'sawtooth', vol: 0.05 });
  },
  explode(wave, n) {
    noise({ dur: 0.38, vol: Math.min(0.55, 0.22 + n * 0.05), from: 1800, to: 120 });
    tone({ freq: 170, to: 45, dur: 0.32, type: 'sine', vol: 0.4 });
    tone({ freq: 380 * Math.pow(2, Math.min(wave, 14) / 12), dur: 0.1, type: 'square', vol: 0.07 });
  },
  combo(n) {
    const steps = Math.min(5, n - 2);
    for (let i = 0; i < steps; i++)
      tone({ freq: 440 * Math.pow(2, i * 2 / 12), dur: 0.12, type: 'triangle', vol: 0.2, delay: 0.05 + i * 0.07 });
  },
  eliminated() {
    tone({ freq: 440, to: 110, dur: 0.6, type: 'triangle', vol: 0.3, delay: 0.1 });
    tone({ freq: 330, to: 82, dur: 0.6, type: 'sawtooth', vol: 0.08, delay: 0.1 });
  },
  turn() { tone({ freq: 660, dur: 0.05, type: 'sine', vol: 0.1 }); },
  win() {
    [523, 659, 784, 1047].forEach((f, i) =>
      tone({ freq: f, dur: 0.28, type: 'triangle', vol: 0.3, delay: 0.5 + i * 0.13 }));
    tone({ freq: 1047, dur: 0.7, type: 'sine', vol: 0.2, delay: 1.05 });
  }
};
muteBtn.addEventListener('click', () => {
  initAudio();
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';

let wakeLock = null;

function neighbors(r, c) {

}
function critical(r, c) {
  return (r > 0) + (r < ROWS - 1) + (c > 0) + (c < COLS - 1);
}
function getTurnOrder() {
  const active = [];
  const available = [0, 1, 2, 3];
  const human = Number(settings.humanColor);
  active.push(human);
  for (const p of available) {
    if (p !== human && active.length < settings.players) active.push(p);
  }
  return active;
}
function setupGame() {
  clearTimeout(aiTimer);
  gameId++;
  const b = BOARDS[settings.board];
  COLS = b.cols;
  ROWS = b.rows;
  owner = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  count = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  spin = new Float32Array(ROWS * COLS).map(() => Math.random() * TAU);
  turnOrder = getTurnOrder();
  current = turnOrder[0];
  hasPlayed = PLAYERS.map((_, i) => !turnOrder.includes(i));
  eliminated = PLAYERS.map((_, i) => !turnOrder.includes(i));
  winner = -1;
  busy = false;
  moveCount = 0;
  denied = null;
  banner = null;
  chainFx = null;
  guardUntil = 0;
  flights = [];
  fx = [];
  particles = [];
  charging = null;
  pops = new Map();
  chips.forEach((el, i) => {

}
function beginGame() {

}
function tilesOf(p) {
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)

}
function checkState() {
  const out = [];
  for (const p of turnOrder) {
    if (!eliminated[p] && tilesOf(p) === 0) {
      eliminated[p] = true;
      out.push(p);
    }
  }
  const alive = turnOrder.filter(p => !eliminated[p]);
  if (alive.length === 1) winner = alive[0];
  return out;
}
function nextTurn() {
  if (!turnOrder.length) return;
  const idx = turnOrder.indexOf(current);
  let nextIndex = idx === -1 ? 0 : idx;
  let tries = 0;
  do {
    nextIndex = (nextIndex + 1) % turnOrder.length;
    tries++;
  } while (eliminated[turnOrder[nextIndex]] && tries < turnOrder.length + 1);
  current = turnOrder[nextIndex];

}
const names = list => list.map(p => PLAYERS[p].name).join(' & ');

}
function updateUI(msg) {

    el.style.display = visible ? '' : 'none';
    const active = i === current && winner === -1;
    el.classList.toggle('active', active);
    el.classList.toggle('out', eliminated[i] && visible);
    el.style.borderColor = (active || i === winner) ? PLAYERS[i].color : 'transparent';
    el.style.opacity = i === winner ? 1 : '';
    el.querySelector('.count').textContent = tilesOf(i);
  });
  const acting = winner !== -1 ? winner : (turnOrder.includes(current) ? current : turnOrder[0]);
  const who = acting ?? 0;
  canvas.style.boxShadow = `0 0 0 3px ${PLAYERS[who].color}, 0 0 28px rgba(${PLAYERS[who].rgb},0.35), 0 8px 30px rgba(0,0,0,0.6)`;
  setHue(who);
  if (winner !== -1) {
    messageEl.textContent = `${PLAYERS[winner].name} is the last player standing!`;
    messageEl.style.color = PLAYERS[winner].color;

    messageEl.textContent = msg || `${PLAYERS[current].name}'s turn: tap an empty or your own tile`;
    messageEl.style.color = PLAYERS[current].color;

const sleep = ms => new Promise(r => setTimeout(r, ms));

function evaluateAiMove(r, c) {
  const ownTile = owner[r][c] === current;
  const emptyTile = owner[r][c] === -1;
  const nextCount = owner[r][c] === -1 ? 1 : count[r][c] + 1;
  const threshold = critical(r, c);
  const centerDistance = Math.abs(r - (ROWS - 1) / 2) + Math.abs(c - (COLS - 1) / 2);
  let score = 0;

  score += (10 - centerDistance) * 2.5;
  if (emptyTile) score += 8;
  if (ownTile) score += 12 + count[r][c] * 3;
  if (nextCount >= threshold) score += 35 + (threshold === 4 ? 18 : 10);
  if (nextCount === threshold) score += 12;

  const liveOpponents = turnOrder.filter(p => p !== current && !eliminated[p]).length;
  if (liveOpponents === 1) score += 22;

  for (const [nr, nc] of neighbors(r, c)) {
    const neighbourOwner = owner[nr][nc];
    if (neighbourOwner === current) {
      score += 6 + count[nr][nc] * 2;
    } else if (neighbourOwner !== -1) {
      score -= 4 + count[nr][nc];
    } else {
      score += 2;
    }
    if (neighbourOwner !== -1 && neighbourOwner !== current && count[nr][nc] >= critical(nr, nc) - 1) {
      score -= 9;
    }
  }

  if (nextCount >= threshold) {
    let chainSupport = 0;
    for (const [nr, nc] of neighbors(r, c)) {
      if (owner[nr][nc] === current && count[nr][nc] + 1 >= critical(nr, nc)) {
        chainSupport += 1;

  const options = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {

      if (cellOwner !== -1 && cellOwner !== current) continue;
      const score = evaluateAiMove(r, c);
      options.push({ r, c, score });
    }
  }
  if (!options.length) return null;
  options.sort((a, b) => b.score - a.score);
  const top = options[0].score;
  const finalists = options.filter(o => o.score >= top - 6);
  return finalists[Math.floor(Math.random() * finalists.length)];
}

    if (winner !== -1 || settings.mode !== 'ai' || current === settings.humanColor || busy) return;
    const move = chooseAiMove();

async function resolveChain(id) {
  const elim = [];
  let waves = 0;
  for (let wave = 0; wave < MAX_WAVES; wave++) {
    const blowing = [];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (count[r][c] >= critical(r, c)) blowing.push([r, c]);
    if (!blowing.length) break;
    waves = wave + 1;
    chainFx = { n: waves, p: current, pulse: performance.now(), endAt: 0 };
    const speed = Math.max(0.45, 1 - wave * 0.04);
    const chargeMs = CHARGE_MS * speed;
    const flyMs = FLY_MS * speed;
    charging = {
      set: new Set(blowing.map(([r, c]) => r * COLS + c)),
      start: performance.now(),
      dur: chargeMs
    };
    sfx.charge(wave, chargeMs);
    await sleep(chargeMs);
    if (id !== gameId) return { elim, waves: 0 };
    charging = null;
    sfx.explode(wave, blowing.length);
    kick(Math.min(14, 2 + blowing.length * 1.2 + wave * 0.8));
    const now = performance.now();
    const gains = [];
    flights = [];
    for (const [r, c] of blowing) {
      const p = owner[r][c];
      fx.push({ kind: 'ring', x: c + 0.5, y: r + 0.5, p, start: now, dur: flyMs * 1.2, max: 1.1 });
      for (let k = 0; k < 8; k++) {
        const a = Math.random() * TAU, sp = 0.8 + Math.random() * 1.6;
        particles.push({ x: c + 0.5, y: r + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                         start: now, life: 420 + Math.random() * 200, p });
      }
      for (const [nr, nc] of neighbors(r, c)) {
        gains.push({ r: nr, c: nc, p });
        flights.push({ r0: r, c0: c, r1: nr, c1: nc, p, start: now, dur: flyMs });
      }
      owner[r][c] = -1;
      count[r][c] = 0;
    }
    await sleep(flyMs);
    if (id !== gameId) return { elim, waves: 0 };
    flights = [];
    const landed = performance.now();
    for (const g of gains) {
      owner[g.r][g.c] = g.p;
      count[g.r][g.c] += 1;
      pops.set(g.r * COLS + g.c, landed);
      fx.push({ kind: 'flash', r: g.r, c: g.c, p: g.p, start: landed, dur: 320 });
    }
    const out = checkState();
    if (out.length) { sfx.eliminated(); elim.push(...out); kick(12); }
    updateUI(winner !== -1 ? undefined :
      elim.length ? `${names(elim)} eliminated!`
                  : `${PLAYERS[current].name} triggered a chain reaction!`);
    if (winner !== -1) break;
  }
  flights = [];
  charging = null;
  if (chainFx) chainFx.endAt = performance.now();
  if (waves >= 3) sfx.combo(waves);
  return { elim, waves };
}

async function handleTap(col, row, fromAI = false) {
  if(settings.mode==='remote'){remoteMove(col,row);return;}
  if (busy || winner !== -1) return;
  if (isAiTurn() && !fromAI) return;
  if (performance.now() < guardUntil) return;
  const o = owner[row][col];
  if (o !== -1 && o !== current) {
    sfx.denied();
    const d = { col, row, until: performance.now() + DENIED_MS };
    denied = d;
    updateUI(`That tile belongs to ${PLAYERS[o].name}`);
    setTimeout(() => { if (denied === d) denied = null; }, DENIED_MS);
    return;
  }
  busy = true;
  const id = gameId;
  hasPlayed[current] = true;
  moveCount++;
  if (o === -1) {
    owner[row][col] = current;
    count[row][col] = 1;
    sfx.place(current);
  } else {
    count[row][col] += 1;
    sfx.add(count[row][col], current);
  }
  const t = performance.now();
  pops.set(row * COLS + col, t);
  fx.push({ kind: 'ring', x: col + 0.5, y: row + 0.5, p: current, start: t, dur: 300, max: 0.6 });
  updateUI();
  const { elim, waves } = await resolveChain(id);
  if (id !== gameId) return;
  busy = false;
  if (winner === -1) {
    const notes = [];
    if (waves >= 3) notes.push(`${waves}-wave chain`);
    if (elim.length) notes.push(`${names(elim)} eliminated`);
    nextTurn();
    updateUI(notes.length ? `${notes.join(' · ')}! ${PLAYERS[current].name}'s turn` : undefined);
    sfx.turn();
    showBanner(notes.join(' · '));
    scheduleAiTurn();
  } else {
    updateUI();
    sfx.win();
    setTimeout(() => { if (id === gameId && winner !== -1) openResult(); }, 1700);
  }
}

function resize() {
  const used = playersEl.offsetHeight + messageEl.offsetHeight + controlsEl.offsetHeight + 12 * 3;
  const availW = window.innerWidth - PADDING * 2;
  const availH = window.innerHeight - used - PADDING * 2;
  cell = Math.max(10, Math.floor(Math.min(availW / COLS, availH / ROWS)));
  const w = cell * COLS, h = cell * ROWS;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);

      g.lineTo(cx + size * 1.1, cy);

      ctx.lineWidth = Math.max(1, cell * 0.08 * (1 - t));
      ctx.beginPath();
      ctx.arc(f.x * cell, f.y * cell, f.max * cell * e, 0, TAU);
      ctx.stroke();
    } else {
      ctx.fillStyle = `rgba(${P.rgb},${(1 - t) * 0.45})`;
      ctx.fillRect(f.c * cell, f.r * cell, cell, cell);
    }
  }
  fx = fx.filter(f => now - f.start < f.dur);
  ctx.lineCap = 'round';
  for (const f of flights) {
    const t = Math.min(1, Math.max(0, (now - f.start) / f.dur));
    const e = 1 - Math.pow(1 - t, 3);
    const x0 = (f.c0 + 0.5) * cell, y0 = (f.r0 + 0.5) * cell;
    const x1 = (f.c1 + 0.5) * cell, y1 = (f.r1 + 0.5) * cell;
    const x = x0 + (x1 - x0) * e, y = y0 + (y1 - y0) * e;
    const et = Math.max(0, e - 0.45);
    ctx.strokeStyle = `rgba(${PLAYERS[f.p].rgb},0.45)`;
    ctx.lineWidth = cell * 0.14;
    ctx.beginPath();
    ctx.moveTo(x0 + (x1 - x0) * et, y0 + (y1 - y0) * et);
    ctx.lineTo(x, y);
    ctx.stroke();
    drawAtom(f.p, x, y, cell * 0.15 * TUNING.atomScale);
  }
  ctx.lineCap = 'butt';
  for (const p of particles) {
    const t = (now - p.start) / p.life;
    if (t < 0 || t >= 1) continue;
    const sec = (now - p.start) / 1000;
    ctx.fillStyle = `rgba(${PLAYERS[p.p].rgb},${1 - t})`;
    ctx.beginPath();
    ctx.arc((p.x + p.vx * sec) * cell, (p.y + p.vy * sec) * cell, cell * 0.045 * (1 - t * 0.5), 0, TAU);
    ctx.fill();
  }
  particles = particles.filter(p => now - p.start < p.life);
  drawChainPill(now, W);
  if (denied) {
    const t = Math.max(0, (denied.until - now) / DENIED_MS);
    const o = PLAYERS[owner[denied.row][denied.col]];
    if (o) {
      const x = denied.col * cell, y = denied.row * cell;
      ctx.globalAlpha = t * 0.5;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, cell, cell);
      ctx.globalAlpha = t;
      ctx.strokeStyle = o.color;
      ctx.lineWidth = 4;
      ctx.strokeRect(x + 2, y + 2, cell - 4, cell - 4);
      const m = cell * 0.28;
      ctx.beginPath();
      ctx.moveTo(x + m, y + m);
      ctx.lineTo(x + cell - m, y + cell - m);
      ctx.moveTo(x + cell - m, y + m);
      ctx.lineTo(x + m, y + cell - m);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  if (banner) {
    const t = now - banner.start;
    if (t >= BANNER_MS) {
      banner = null;
    } else {
      const a = Math.max(0, Math.min(1, t / 150, (BANNER_MS - t) / 300));
      const p = PLAYERS[banner.player];
      const bw = W * 0.82;
      const bh = cell * (banner.sub ? 1.5 : 1.05);
      const bx = (W - bw) / 2;
      const by = (H - bh) / 2;
      const rowY = by + (banner.sub ? bh * 0.36 : bh / 2);
      ctx.globalAlpha = a;
      roundedRectPath(bx, by, bw, bh, cell * 0.25);
      ctx.fillStyle = 'rgba(10,12,16,0.88)';
      ctx.fill();
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      ctx.stroke();
      drawAtom(banner.player, bx + cell * 0.7, rowY, cell * 0.2);
      ctx.fillStyle = p.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.floor(cell * 0.46)}px system-ui`;
      ctx.fillText(`${p.name}'s turn`, bx + bw / 2 + cell * 0.2, rowY);
      if (banner.sub) {
        ctx.fillStyle = '#cfd4dc';
        ctx.font = `${Math.floor(cell * 0.3)}px system-ui`;
        ctx.fillText(banner.sub, bx + bw / 2, by + bh * 0.76);
      }
      ctx.globalAlpha = 1;
    }
  }
  if (winner !== -1) {
    const w = PLAYERS[winner];
    const bh = cell * 1.6, by = (H - bh) / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, by, W, bh);
    ctx.fillStyle = w.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.floor(cell * 0.6)}px system-ui`;
    ctx.fillText(`${w.name} overruns the field!`, W / 2, by + bh / 2);
  }
}
function tick() {
  draw();
  const t = (performance.now() - shake.start) / shake.dur;
  if (t < 1) {
    const a = shake.amp * (1 - t) * (1 - t);
    canvas.style.transform =
      `translate(${((Math.random() - 0.5) * 2 * a).toFixed(1)}px, ${((Math.random() - 0.5) * 2 * a).toFixed(1)}px)`;
    shaking = true;
  } else if (shaking) {
    canvas.style.transform = '';
    shaking = false;
  }
  requestAnimationFrame(tick);
}
function closeOverlay() { overlay.classList.remove('show'); }
function openMenu() {
  setHue(-1);
  panel.classList.add('menu-panel');
  panel.innerHTML = `
    <header class="menu-brand">
      <div class="menu-kicker">Last infestation standing</div>
      <h1>PESTILENCE</h1>
      <p>One field. No safe plots. Be the last infestation standing.</p>
    </header>

    <section class="menu-section">
      <div class="menu-label">Choose how to play</div>
      <div class="mode-grid" role="group" aria-label="Game mode">
        <button class="mode-card" data-mode="local" type="button"><strong>Local</strong><span>Pass & play</span></button>
        <button class="mode-card" data-mode="ai" type="button"><strong>Vs AI</strong><span>Challenge a bot</span></button>
        <button class="mode-card" data-mode="remote" type="button"><strong>Remote</strong><span>Play online</span></button>
      </div>
    </section>

    <section class="menu-section" id="playerSettings">
      <div class="setting-grid">
        <div class="menu-section">
          <div class="menu-label">Players</div>
          <div class="choice-row" data-key="players">
            ${[2,3,4].map(n=>`<button type="button" data-v="${n}">${n}</button>`).join('')}
          </div>
        </div>
        <div class="menu-section">
          <div class="menu-label">Board</div>
          <div class="choice-row" data-key="board">
            <button type="button" data-v="small">Small</button>
            <button type="button" data-v="standard">Standard</button>
          </div>
        </div>
      </div>
    </section>

    <section class="menu-section" id="colorSettings" hidden>
      <div class="menu-label">Your color</div>
      <div class="color-row" data-key="humanColor">
        ${PLAYERS.map((p,i)=>`<button class="color-pick" type="button" data-v="${i}" aria-label="${p.name}" title="${p.name}"><span class="dot" style="background:${p.color}"></span></button>`).join('')}
      </div>
    </section>

    <div class="menu-actions">
      <button class="primary" id="startBtn" type="button">Start game</button>
      <button class="secondary" id="joinToggle" type="button" hidden>Join with a room code</button>
      <div class="join-box" id="joinBox" hidden>
        <input class="remote-input" id="joinRoomCode" maxlength="6" placeholder="ENTER CODE" aria-label="Six-character room code" autocomplete="off" spellcheck="false">
        <button class="primary" id="joinRemoteBtn" type="button">Join room</button>
      </div>
    </div>

    <details class="rules-disclosure">
      <summary>How to play</summary>
      <p class="rules">Tap an empty wheat plot or one of your own plots to add an infestation unit. A plot erupts at its limit: corners 2, edges 3, middle 4. The outbreak captures neighboring plots and can trigger chain reactions. Eliminate every rival infestation to win. Wheat remains visible beneath every outbreak.</p>
    </details>
  `;

  const refresh = () => {
    panel.querySelectorAll('[data-key]').forEach(group => {
      const key=group.dataset.key;
      group.querySelectorAll('button').forEach(button => {
        const selected = key==='players' ? String(settings.players)===button.dataset.v
          : key==='board' ? settings.board===button.dataset.v
          : String(settings.humanColor)===button.dataset.v;
        button.classList.toggle('selected',selected);
      });
    });
    panel.querySelectorAll('[data-mode]').forEach(button => {
      button.classList.toggle('selected',button.dataset.mode===settings.mode);
      button.setAttribute('aria-pressed',String(button.dataset.mode===settings.mode));
    });
    panel.querySelector('#colorSettings').hidden = settings.mode!=='ai';
    panel.querySelector('#joinToggle').hidden = settings.mode!=='remote';
    panel.querySelector('#startBtn').textContent = settings.mode==='remote' ? 'Create room' : 'Start game';
    panel.querySelector('#playerSettings').hidden = false;
  };

  panel.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click',()=>{
    initAudio(); sfx.click(); settings.mode=button.dataset.mode; refresh();
  }));
  panel.querySelectorAll('[data-key] button').forEach(button => button.addEventListener('click',()=>{
    initAudio(); sfx.click();
    const key=button.parentElement.dataset.key;
    if(key==='players') settings.players=Number(button.dataset.v);
    if(key==='board') settings.board=button.dataset.v;
    if(key==='humanColor') settings.humanColor=Number(button.dataset.v);
    refresh();
  }));

  panel.querySelector('#startBtn').addEventListener('click',()=>{
    initAudio(); sfx.click();
    if(settings.mode==='remote'){createRemoteRoom();return;}
    closeOverlay(); beginGame();
  });
  panel.querySelector('#joinToggle').addEventListener('click',()=>{
    const box=panel.querySelector('#joinBox');
    box.hidden=!box.hidden;
    if(!box.hidden) panel.querySelector('#joinRoomCode').focus();
  });
  const join=()=>{
    const input=panel.querySelector('#joinRoomCode');
    const code=input.value.trim().toUpperCase();
    if(code.length!==6){input.setCustomValidity('Enter the six-character room code.');input.reportValidity();return;}
    input.setCustomValidity(''); joinRemoteRoom(code);
  };
  panel.querySelector('#joinRemoteBtn').addEventListener('click',join);
  panel.querySelector('#joinRoomCode').addEventListener('keydown',event=>{if(event.key==='Enter')join();});
  panel.querySelector('#joinRoomCode').addEventListener('input',event=>{event.target.value=event.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});
  refresh();
  overlay.classList.add('show');
}
function openResult() {
  panel.classList.remove('menu-panel');
  const w = PLAYERS[winner];
  if(settings.mode==='remote'){
    panel.innerHTML = `<h1 style="color:${w.color}">${w.name} wins!</h1><p>Remote game complete.</p>${remote.isHost?'<button class="primary" id="remoteAgain">Play again</button>':'<p>Waiting for the host to start another game…</p>'}<button class="secondary" id="remoteMenu">Leave room</button>`;
    const again=panel.querySelector('#remoteAgain');
    if(again)again.addEventListener('click',async()=>{try{const s=await remoteRequest('/room/'+remote.code+'/restart','POST',{});applyRemoteState(s);closeOverlay();startRemotePolling();}catch(e){alert(e.message);}});
    panel.querySelector('#remoteMenu').addEventListener('click',()=>{stopRemotePolling();remote={code:null,token:null,color:null,isHost:false,poll:null,snapshot:null};setupGame();openMenu();});
    overlay.classList.add('show'); return;
  }
  panel.innerHTML = `
    <h1 style="color:${w.color}">${w.name} wins!</h1>
    <p>Last infestation standing.</p>
    <button class="primary" id="again" style="margin-top:8px">Play again</button>
    <button class="secondary" id="menu">Change settings</button>
    <button class="secondary" id="view">View board</button>`;
  panel.querySelector('#again').addEventListener('click', () => { sfx.click(); closeOverlay(); beginGame(); });
  panel.querySelector('#menu').addEventListener('click', () => { sfx.click(); setupGame(); openMenu(); });
  panel.querySelector('#view').addEventListener('click', () => { sfx.click(); closeOverlay(); });
  overlay.classList.add('show');
}
function openConfirm() {
  panel.innerHTML = `
    <h2>End this game?</h2>
    <p>Current progress will be lost.</p>
    <button class="primary danger" id="yes" style="margin-top:8px">End game</button>
    <button class="secondary" id="no">Keep playing</button>`;
  panel.querySelector('#yes').addEventListener('click', () => { sfx.click(); if(settings.mode==='remote'){stopRemotePolling();remote={code:null,token:null,color:null,isHost:false,poll:null,snapshot:null};} setupGame(); openMenu(); });
  panel.querySelector('#no').addEventListener('click', () => { sfx.click(); closeOverlay(); });
  overlay.classList.add('show');
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const col = Math.floor((e.clientX - rect.left) / cell);
  const row = Math.floor((e.clientY - rect.top) / cell);
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return;
  handleTap(col, row);
});
document.addEventListener('contextmenu', e => e.preventDefault());
resetBtn.addEventListener('click', () => {
  initAudio();
  sfx.click();
  if (winner !== -1 || moveCount === 0) { setupGame(); openMenu(); }
  else openConfirm();
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
setupGame();
openMenu();
requestAnimationFrame(tick);
</script>
</body>
</html>
